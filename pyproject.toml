[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spark-delta-cdc-lakehouse"
version = "0.1.0"
description = "Spark Delta CDC Lakehouse - synthetic portfolio implementation"
requires-python = ">=3.9"
dependencies = [

]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<0.29"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
